apiVersion: v1
kind: Namespace
metadata:
  name: relayq
---
apiVersion: v1
kind: Secret
metadata:
  name: relayq-app-secret
  namespace: relayq
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "relayq"
  SPRING_DATASOURCE_PASSWORD: "relayq"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayq-app
  namespace: relayq
  labels:
    app: relayq-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: relayq-app
  template:
    metadata:
      labels:
        app: relayq-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: relayq-app
          image: relayq-example:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-master.mysql.svc.cluster.local:3306/relayq?connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: relayq-app-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relayq-app-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: RELAYQ_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: relayq-app
  namespace: relayq
  labels:
    app: relayq-app
spec:
  type: ClusterIP
  selector:
    app: relayq-app
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
