apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqld-exporter-master
  namespace: monitoring
  labels:
    app: mysqld-exporter
    mysql_role: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysqld-exporter
      mysql_role: master
  template:
    metadata:
      labels:
        app: mysqld-exporter
        mysql_role: master
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.19.0
          imagePullPolicy: IfNotPresent
          args:
            - --mysqld.username=relayq_exporter
            - --mysqld.address=mysql-master.mysql.svc.cluster.local:3306
            - --collect.binlog_size
            - --collect.info_schema.innodb_metrics
            - --collect.info_schema.processlist
            - --collect.perf_schema.tablelocks
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-exporter-credentials
                  key: password
          ports:
            - name: metrics
              containerPort: 9104
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: mysqld-exporter-master
  namespace: monitoring
  labels:
    app: mysqld-exporter
    mysql_role: master
spec:
  selector:
    app: mysqld-exporter
    mysql_role: master
  ports:
    - name: metrics
      port: 9104
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
