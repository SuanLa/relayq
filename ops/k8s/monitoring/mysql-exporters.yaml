      containers:
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.19.0
          imagePullPolicy: IfNotPresent
          args:
            - --mysqld.username=relayq_exporter
            - --mysqld.address=mysql-slave.mysql.svc.cluster.local:3306
            - --collect.info_schema.innodb_metrics
            - --collect.info_schema.processlist
            - --collect.perf_schema.tablelocks
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-exporter-credentials
                  key: password
          ports:
            - name: metrics
              containerPort: 9104
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
