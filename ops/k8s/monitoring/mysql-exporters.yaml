---
apiVersion: v1
kind: Service
metadata:
  name: mysqld-exporter-slave
  namespace: monitoring
  labels:
    app: mysqld-exporter
    mysql_role: slave
spec:
  selector:
    app: mysqld-exporter
    mysql_role: slave
  ports:
    - name: metrics
      port: 9104
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mysqld-exporters
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: mysqld-exporter
  jobLabel: app
  targetLabels:
    - mysql_role
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 5s
      scrapeTimeout: 4s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: relayq-mysql-health
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: relayq.mysql
      rules:
        - alert: RelayqMySqlExporterDown
          expr: mysql_up{job="mysqld-exporter"} != 1
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "MySQL exporter cannot query {{ $labels.mysql_role }}"
        - alert: RelayqMySqlReplicationStopped
          expr: |
            mysql_slave_status_slave_io_running{mysql_role="slave"} != 1
            or mysql_slave_status_slave_sql_running{mysql_role="slave"} != 1
          for: 15s
          labels:
            severity: critical
          annotations:
            summary: "MySQL replication IO or SQL thread stopped"
        - alert: RelayqMySqlReplicationLag
          expr: mysql_slave_status_seconds_behind_master{mysql_role="slave"} > 5
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "MySQL replica lag is above 5 seconds"
